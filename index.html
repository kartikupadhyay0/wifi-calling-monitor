<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Calling Health Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dynamic Background Image with Nature Theme -->
    <div class="bg-overlay"></div>

    <div class="app-container">
        <!-- Top Navigation / Header -->
        <header class="top-nav">
            <div class="brand">
                <span class="signal-icon">📶</span>
                <h2>Wi-Fi Calling Diagnostic</h2>
            </div>
            <div id="statusBadge" class="badge checking">Connecting...</div>
        </header>

        <!-- Main Hero Section (Full Screen Ping Focus) -->
        <main class="hero-section">
            <div class="ping-hero-card">
                <div class="pulse-ring" id="pulseRing"></div>
                <div class="ping-hero-content">
                    <span class="hero-label">CURRENT LATENCY</span>
                    <div class="giant-ping">
                        <span id="pingValue">--</span>
                        <span class="unit">ms</span>
                    </div>
                    <div class="live-pill">
                        <span class="blinking-dot"></span>
                        <span id="statusTitle">Checking Speed...</span>
                    </div>
                </div>
            </div>

            <!-- Status Details Bar -->
            <div class="info-bar">
                <p id="statusDesc">Analyzing your Wi-Fi signal response time in real-time...</p>
                <a href="wifi-monitor.apk" download class="btn-download-app">
                    <span>📥 Download App (APK)</span>
                </a>
            </div>
        </main>

        <!-- Premium Footer -->
        <footer>
            <p>Designed & Developed by <strong>Kartik Upadhyay</strong></p>
            <p class="copyright">&copy; 2026 Kartik Upadhyay. All rights reserved.</p>
        </footer>
    </div>

    <script>
        async function checkPing() {
            const start = performance.now();
            const pingValueEl = document.getElementById('pingValue');
            const statusBadgeEl = document.getElementById('statusBadge');
            const statusTitleEl = document.getElementById('statusTitle');
            const statusDescEl = document.getElementById('statusDesc');
            const pulseRingEl = document.getElementById('pulseRing');

            try {
                await fetch('https://www.cloudflare.com/cdn-cgi/trace', { mode: 'no-cors', cache: 'no-store' });
                const end = performance.now();
                const duration = Math.round(end - start);

                pingValueEl.innerText = duration;

                if (duration < 100) {
                    statusBadgeEl.innerText = 'OPTIMAL';
                    statusBadgeEl.className = 'badge optimal';
                    statusTitleEl.innerText = 'Wi-Fi Calling Excellent';
                    statusDescEl.innerText = 'Low latency detected. Voice calls will run smoothly without disconnections.';
                    pulseRingEl.style.borderColor = 'rgba(74, 222, 128, 0.5)';
                    pingValueEl.style.color = '#4ade80';
                } else {
                    statusBadgeEl.innerText = 'HIGH PING';
                    statusBadgeEl.className = 'badge poor';
                    statusTitleEl.innerText = 'High Latency Detected';
                    statusDescEl.innerText = 'High response time. Wi-Fi calling might freeze or drop.';
                    pulseRingEl.style.borderColor = 'rgba(248, 113, 113, 0.5)';
                    pingValueEl.style.color = '#f87171';
                }
            } catch (error) {
                pingValueEl.innerText = 'ERR';
                statusBadgeEl.innerText = 'OFFLINE';
                statusBadgeEl.className = 'badge offline';
                statusTitleEl.innerText = 'Disconnected';
                statusDescEl.innerText = 'Please check your internet connection or Wi-Fi router.';
                pulseRingEl.style.borderColor = 'rgba(255, 255, 255, 0.2)';
                pingValueEl.style.color = '#cbd5e1';
            }
        }

        setInterval(checkPing, 3000);
        checkPing();
    </script>
</body>
</html>
